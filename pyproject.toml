[project]
name = "amazon-hikaku-mcp"
version = "0.1.0"
description = "Remote MCP server for amazon-hikaku.com product research data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12,<2",
    "httpx>=0.27",
    "uvicorn>=0.30",
    # Pinned pair: sudachipy 0.7 changed the dictionary binary format, so
    # the dictionary version is fixed to the one verified with 0.7.x.
    # Upgrade the two together, deliberately.
    "sudachipy>=0.7,<0.8",
    "sudachidict_core==20261015",
]

[project.urls]
Homepage = "https://www.amazon-hikaku.com/ai/"
Repository = "https://github.com/aegisfleet/amazon-hikaku-mcp"

[project.scripts]
amazon-hikaku-mcp = "amazon_hikaku_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amazon_hikaku_mcp"]

